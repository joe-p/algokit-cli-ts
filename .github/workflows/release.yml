name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch tip rather than the pushed commit, so a queued run
      # releases everything that has landed on main since.
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Prepare release
        id: semfrag
        uses: joe-p/semfrag/actions/prepare@e4ce6e37a786a2d283ce7edbaf235af5aa8d48b7 # v0.9.0

      - name: Bump package.json version
        if: steps.semfrag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.semfrag.outputs.version }}
        run: npm pkg set "version=${VERSION}"

      - name: Build
        if: steps.semfrag.outputs.released == 'true'
        run: npm run build

      - name: Commit, tag and create GitHub release
        if: steps.semfrag.outputs.released == 'true'
        uses: joe-p/semfrag/actions/publish@e4ce6e37a786a2d283ce7edbaf235af5aa8d48b7 # v0.9.0

      - name: Publish to npm
        if: steps.semfrag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.semfrag.outputs.version }}
        run: |
          name="$(npm pkg get name | tr -d '"')"
          if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
            echo "${name}@${VERSION} is already published."
          else
            npm publish --access public
          fi

      - name: Roll back failed release
        if: failure() || cancelled()
        uses: joe-p/semfrag/actions/rollback@e4ce6e37a786a2d283ce7edbaf235af5aa8d48b7 # v0.9.0
